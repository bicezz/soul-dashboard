<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SØUL Dashboard · Anima di Davide</title>
<style>
:root{--bg:#0e0c12;--panel:#17131d;--text:#f8f3ff;--muted:#b9adbf;--accent:#bf77ff;--gold:#ffcf66;--ok:#72e6a5;--line:#33283e;--shadow:0 18px 50px rgba(0,0,0,.34)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#2f173e 0,transparent 35%),linear-gradient(180deg,#110e15,#09080b);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px 18px 54px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px;flex-wrap:wrap}.brand h1{margin:0;font-size:clamp(2rem,6vw,4.5rem);line-height:.95;letter-spacing:-.045em}.brand p{margin:.65rem 0 0;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#141019;padding:8px 12px;border-radius:999px;color:var(--muted);font-size:.88rem}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}button{font:inherit}.btn{border:1px solid var(--accent);background:var(--accent);color:#150c1c;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:800}.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}.card{background:linear-gradient(145deg,rgba(34,27,42,.97),rgba(20,16,25,.97));border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.label{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.09em}.big{font-size:clamp(1.7rem,4vw,2.7rem);font-weight:850;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.person{position:relative;overflow:hidden}.person:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold))}.name{font-size:1.18rem;font-weight:800}.balance{font-size:1.8rem;font-weight:850;margin-top:12px}.fiat{color:var(--gold);font-weight:750}.address{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.78rem;margin-top:12px}.footer{margin-top:18px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.status{min-height:1.4em;color:var(--muted);margin:10px 2px}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.wrap{padding:20px 12px 40px}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand"><h1>ANIMA DI DAVIDE</h1><p>La lobby custodisce <strong>SØUL</strong>, on-chain su Base Sepolia.</p></div><button class="btn" id="refreshBtn" type="button">Aggiorna saldi</button></header>
<div class="pill"><span class="dot"></span><span>Base Sepolia · dati on-chain</span></div><div class="status" id="status" aria-live="polite"></div>
<section class="hero"><article class="card"><div class="label">Supply on-chain</div><div class="big" id="supply">104,0 SØUL</div></article><article class="card"><div class="label">Soul Exchange Rate</div><div class="big"><span id="price">666,00 €</span> <span style="font-size:.42em;font-weight:600;color:var(--muted)">/ SØUL</span></div></article><article class="card"><div class="label">Valore totale</div><div class="big" id="totalValue">69.264,00 €</div></article></section>
<section class="grid" id="holders"></section><footer class="footer"><span>RPC: https://sepolia.base.org</span><span id="updated">Mai aggiornato</span></footer></main>
<script>
(()=>{
const RPC='https://sepolia.base.org';
const TOKEN='0x89B5C89575E5C98B6F3AdC8A31997d053368519E';
const PRICE='0xdb844bd750A551AC67F4Ae0b97e71267b2A34699';
const holders=[
{name:'Andrea',address:'0x51b82cFD3F5Ed632CAbefAc7B3658e864d09b6c1'},
{name:'Davide',address:'0x1DE259B2Ffc6b29988CE291CEff8d39556d8C9a8'},
{name:'Federico',address:'0xA2ad5098E020dCB3c95FBF7c983a3fD136DFf388'},
{name:'Francesco',address:'0xFD6dc14859F5927302d33D62343a8d570C0b6daB'},
{name:'Gianluca',address:'0xDDc9c026A97BC146b183Fd4cA85D0FBdF8692847'},
{name:'Luca',address:'0xC50AA543C77002db535300fECFeD06cB10feA823'},
{name:'Mattia',address:'0x7fe9908De7eB0b513a224d5A590b84A87e3c8927'},
{name:'Stefano',address:'0x9222d33aDaB800040b9dAB83a392ff613dE9146E'}];
const $=s=>document.querySelector(s),state={price:666,supply:104,decimals:1,balances:{}};
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n),tok=n=>new Intl.NumberFormat('it-IT',{minimumFractionDigits:1,maximumFractionDigits:1}).format(n),short=a=>a.slice(0,8)+'…'+a.slice(-6);
function render(){ $('#supply').textContent=tok(state.supply)+' SØUL';$('#price').textContent=eur(state.price);$('#totalValue').textContent=eur(state.supply*state.price);$('#holders').innerHTML=holders.map(h=>{const b=state.balances[h.name]??13;return `<article class="card person"><div class="name">${h.name}</div><div class="balance">${tok(b)} SØUL</div><div class="fiat">${eur(b*state.price)}</div><div class="address">${short(h.address)}</div></article>`}).join('');}
async function rpc(method,params){const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:Date.now()+Math.random(),method,params})});const j=await r.json();if(j.error)throw new Error(j.error.message);return j.result;}async function call(to,data){return rpc('eth_call',[{to,data},'latest']);}const bi=h=>BigInt(h||'0x0');
async function refresh(){ $('#refreshBtn').disabled=true;$('#status').textContent='Lettura dei saldi on-chain…';try{const [d,s,p]=await Promise.all([call(TOKEN,'0x313ce567'),call(TOKEN,'0x18160ddd'),call(PRICE,'0xe80ed129')]);state.decimals=Number(bi(d));state.supply=Number(bi(s))/10**state.decimals;state.price=Number(bi(p))/100;const vals=await Promise.all(holders.map(h=>call(TOKEN,'0x70a08231'+h.address.slice(2).padStart(64,'0'))));holders.forEach((h,i)=>state.balances[h.name]=Number(bi(vals[i]))/10**state.decimals);render();$('#status').textContent='Saldi aggiornati correttamente.';$('#updated').textContent='Aggiornato: '+new Date().toLocaleString('it-IT');}catch(e){$('#status').textContent='Errore durante la lettura di Base Sepolia: '+e.message;}finally{$('#refreshBtn').disabled=false;}}
$('#refreshBtn').addEventListener('click',refresh);render();refresh();
})();
</script></body></html>
